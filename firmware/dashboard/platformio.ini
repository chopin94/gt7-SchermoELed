; GT7 Schermo - firmware della dashboard 320x240 (ESP32 "Cheap Yellow Display")
;
; Ambienti disponibili:
;   esp32-2432s024c  ESP32-2432S024C 2.4" ILI9341, touch capacitivo CST820 (scheda in uso)
;   esp32            ESP32-2432S028  2.8" ILI9341, touch resistivo XPT2046
;   esp32-st7789     ESP32-2432S028  2.8" ST7789,  touch resistivo XPT2046
;
; Compilare e caricare:  pio run -e esp32-2432s024c -t upload
; Monitor seriale:       pio device monitor -e esp32-2432s024c
; Lo schermo si aggiorna solo via USB: la flash ospita un solo firmware (3 MB)
; e il filesystem dei circuiti salvati (vedi partitions.csv).

[platformio]
default_envs = esp32-2432s024c

[env:esp32]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
; Un firmware da 3 MB e 896 KB di LittleFS. Chi arriva dalla tabella a due slot
; deve caricare questa versione via USB; Wi-Fi e impostazioni restano.
board_build.partitions = partitions.csv
framework = arduino
lib_deps =
	; LovyanGFX: driver display/touch (prima era copiata in src/lgfx, identica alla 1.1.12)
	lovyan03/LovyanGFX@1.1.12
	moononournation/GFX Library for Arduino@1.3.9
	locoduino/RingBuffer@^1.0.4
	; stesso commit dell'URL git, scaricato come archivio così non serve git
	https://github.com/paulo-raca/ArduinoBufferedStreams/archive/5e3a1a3d140955384a07878c64808e77fa2a7521.zip
	tzapu/WiFiManager@^2.0.17
	ricmoo/QRCode@0.0.1
build_flags =
	-w -DESP32=true
monitor_speed = 115200
; Porta COM: decommentare e adattare se il rilevamento automatico non basta
;upload_port = COM9
;monitor_port = COM9
;upload_speed = 921600
;monitor_filters = esp32_exception_decoder

; ESP32-2432S028 con controller ST7789 al posto dell'ILI9341.
[env:esp32-st7789]
extends = env:esp32
build_flags =
	${env:esp32.build_flags}
	-DDISPLAY_PANEL_ST7789=1

; ESP32-2432S024C: stesso cablaggio ILI9341 della ESP32-2432S028, ma la
; retroilluminazione è sul GPIO27 e il touch è un CST820 capacitivo in I2C.
[env:esp32-2432s024c]
extends = env:esp32
build_flags =
	${env:esp32.build_flags}
	-DBOARD_ESP32_2432S024C=1
