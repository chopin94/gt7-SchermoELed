; GT7 LED - firmware della striscia LED WS2812B (shift light) per Gran Turismo 7
;
; Compilare e caricare:  pio run -t upload
; Monitor seriale:       pio device monitor
; Caricare via Wi-Fi:    pio run -e lolin_s2_mini-ota -t upload  (vedi in fondo)

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32@6.9.0
board = lolin_s2_mini
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Password della pagina /update (utente "admin"): decommentare
    ;-DGT7_OTA_PASSWORD=\"cambiami\"
lib_deps =
    fastled/FastLED@3.6.0
    tzapu/WiFiManager@^2.0.17
    ; gt7-udp (MacManley): stessa copia usata dallo schermo. L'ultimo commit
    ; pubblicato (a768574) non compila per un errore di sintassi in GT7UDPParser.cpp
    symlink://../dashboard/lib/GT7Udp
    ; aggiornamento via Wi-Fi, lo stesso dello schermo
    symlink://../dashboard/lib/OtaUpdate
monitor_speed = 115200
; Porta COM: decommentare e adattare se il rilevamento automatico non basta
;upload_port = COM8
;monitor_port = COM8

; Aggiornamento via Wi-Fi della striscia, senza cavo: in custom_ota_address
; l'indirizzo della sua pagina web (lo stesso che lo schermo usa per i LED).
; Si può anche aprire http://indirizzo/update dal browser e caricare il file.
; Serve curl 7.76 o successivo (Windows 10/11 aggiornato, macOS, Linux).
[env:lolin_s2_mini-ota]
extends = env:lolin_s2_mini
custom_ota_address = 192.168.1.51
upload_protocol = custom
upload_command = curl --fail-with-body --show-error -H "Expect:" -H "Content-Type: application/octet-stream" --data-binary "@$SOURCE" http://${this.custom_ota_address}/update
