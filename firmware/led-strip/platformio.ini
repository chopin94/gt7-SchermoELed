; GT7 LED - firmware della striscia LED WS2812B (shift light) per Gran Turismo 7
;
; Compilare e caricare:  pio run -t upload
; Monitor seriale:       pio device monitor

[env:lolin_s2_mini]
platform = espressif32@6.9.0
board = lolin_s2_mini
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    fastled/FastLED@3.6.0
    tzapu/WiFiManager@^2.0.17
    ; gt7-udp (MacManley) bloccata sul commit a768574 usato in sviluppo
    https://github.com/MacManley/gt7-udp/archive/a768574ba809429ce0455b988794e028660f6b9b.zip
monitor_speed = 115200
; Porta COM: decommentare e adattare se il rilevamento automatico non basta
;upload_port = COM8
;monitor_port = COM8
