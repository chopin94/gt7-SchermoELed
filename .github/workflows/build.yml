name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Schermo (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-2432s024c, esp32, esp32-st7789]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-dashboard-${{ hashFiles('firmware/dashboard/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -d firmware/dashboard -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-schermo-${{ matrix.env }}
          path: |
            firmware/dashboard/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/dashboard/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/dashboard/.pio/build/${{ matrix.env }}/partitions.bin

  led-strip:
    name: Striscia LED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-led-${{ hashFiles('firmware/led-strip/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -d firmware/led-strip
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-led-strip
          path: |
            firmware/led-strip/.pio/build/lolin_s2_mini/firmware.bin
            firmware/led-strip/.pio/build/lolin_s2_mini/bootloader.bin
            firmware/led-strip/.pio/build/lolin_s2_mini/partitions.bin

  tests:
    name: Test telemetria e screenshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test firmware/dashboard/tests/simhub-formula.test.mjs
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/telemetry.cpp -o /tmp/telemetry-tests && /tmp/telemetry-tests
      # Delta live, settori, mappa, forze G e cronometro (src/LapAnalysis.h)
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/lap_analysis.cpp -o /tmp/lap-tests && /tmp/lap-tests
      # Punti di frenata e blocchi salvabili del circuito (src/LapAnalysis.h)
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/brake_points.cpp -o /tmp/brake-tests && /tmp/brake-tests
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/track_blobs.cpp -o /tmp/blob-tests && /tmp/blob-tests
      # Salvataggio dei circuiti su file (src/TrackStore.h)
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/track_store.cpp -o /tmp/store-tests && /tmp/store-tests
      # Slittamento, bloccaggi, carico delle sospensioni (src/GripAnalysis.h)
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/grip_analysis.cpp -o /tmp/grip-tests && /tmp/grip-tests
      # Aggiornamento via Wi-Fi della striscia LED (lib/OtaUpdate): controlli sul file e pagina /update
      - run: g++ -std=c++11 -Wall -Wextra -pedantic -fsanitize=address,undefined firmware/dashboard/tests/ota_image.cpp -o /tmp/ota-image-tests && /tmp/ota-image-tests
      - run: g++ -std=gnu++11 -Wall -Wextra -fsanitize=address,undefined -I firmware/dashboard/tests/ota_stubs -I tools/screenshots/stubs -I firmware/dashboard/lib/OtaUpdate firmware/dashboard/tests/ota_web_update.cpp -o /tmp/ota-web-tests && /tmp/ota-web-tests
      # Compila il simulatore dello schermo: verifica che temi e menu disegnino senza errori
      - run: sudo apt-get install -y zlib1g-dev
      - run: tools/screenshots/build.sh /tmp/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/screenshots
